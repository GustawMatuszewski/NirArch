[window]
opacity = 0.85
blur = true
padding = { x = 12, y = 12 }

[colors.primary]
background = "#2c2929"
foreground = "#ffffff"

[colors.cursor]
# Neutral white cursor, no orange
cursor = "#ffffff"
text = "#2c2929"

[colors.normal]
black   = "#1a1a1a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#ffffff" 
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#ffffff"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"