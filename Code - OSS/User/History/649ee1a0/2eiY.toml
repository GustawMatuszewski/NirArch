* {
    font-family: "JetBrainsMono Nerd Font", sans-serif;
    font-size: 15px;
    color: #ffffff;
}

window {
    background-color: #2c2929;
    border: 2px solid #e69934;
    border-radius: 8px;
}

#input {
    background-color: transparent;
    border: none;
    color: transparent;
}

#entry:selected {
    background-color: #e69934; /* Orange background on selection */
}

#text:selected {
    color: #2c2929; /* Dark text on orange for readability */
}