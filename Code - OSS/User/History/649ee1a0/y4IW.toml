[window]
# Transparency level (0.0 to 1.0)
opacity = 0.85
# Adds blur behind the window (if supported by Niri/Compositor)
blur = true
# Padding around text
padding = { x = 12, y = 12 }

[colors.primary]
# Exact Waybar Dark Gray
background = "#2c2929"
foreground = "#ffffff"

[colors.normal]
# Removing yellow tints for a clean gray/white look
black   = "#1a1a1a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#ffffff" 
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.cursor]
# Matches your orange Niri border
cursor = "#e69934"
text = "#2c2929"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"