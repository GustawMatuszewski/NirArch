[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[colors.primary]
background = "#2c2929"
foreground = "#ffffff"

[colors.cursor]
text = "#2c2929"
cursor = "#e69934"

[colors.normal]
black = "#2c2929"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#e69934"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#ffffff"

[window]
padding = { x = 10, y = 10 }
dynamic_title = true
opacity = 0.95

[window.class]
instance = "Alacritty"
general = "Alacritty"