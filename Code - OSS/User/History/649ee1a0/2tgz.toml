[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[colors.primary]
# Exact Waybar Dark Gray
background = "#2c2929"
foreground = "#ffffff"

[colors.cursor]
text = "#2c2929"
# Keep the cursor orange to match your Niri border
cursor = "#e69934"

[colors.normal]
black   = "#2c2929"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#ffffff"
blue    = "#e69934"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#ffffff"

[window]
padding = { x = 12, y = 12 }
dynamic_title = true
# Transparent dark gray
opacity = 0.85
blur = true

[window.class]
instance = "Alacritty"
general = "Alacritty"