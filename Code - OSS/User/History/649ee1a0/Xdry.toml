[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[colors.primary]
# Exact match to your Waybar background
background = "#2c2929"
foreground = "#ffffff"

[colors.cursor]
text = "#2c2929"
cursor = "#e69934"

[colors.normal]
black   = "#2c2929"
red     = "#ff5555"
green   = "#50fa7b"
yellow  = "#f1fa8c"
blue    = "#e69934"
magenta = "#ff79c6"
cyan    = "#8be9fd"
white   = "#ffffff"

[window]
padding = { x = 12, y = 12 }
dynamic_title = true
# Pure transparency (no tint)
opacity = 0.9
blur = true

[window.class]
instance = "Alacritty"
general = "Alacritty"